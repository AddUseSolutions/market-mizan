# Render Blueprint (optional): New → Blueprint → Repo auswählen
#
# Ablauf:
# 1. PostgreSQL aus dieser Blueprint anlegen (oder separat erstellen).
# 2. Web Service "backend" mit Root Directory backend, Build: npm install, Start: npm start.
# 3. DATABASE_URL vom Postgres an den Service knüpfen.
# 4. Einmalig in der Render-Shell: cd backend && npm run db:migrate
# 5. Static Site "frontend": Root frontend, Build npm install && npm run build, Publish dist
# 6. VITE_API_URL = öffentliche Backend-URL (wichtig: vor dem Build setzen)
# 7. Optional SEO/Analytics (vor Frontend-Build): VITE_GA_MEASUREMENT_ID, VITE_GOOGLE_SITE_VERIFICATION
#    Nach Go-live: Google Search Console → Property https://mmizan.com → Sitemaps:
#    https://mmizan.com/sitemap-index.xml

databases:
  - name: market-mizan-db
    databaseName: market_mizan
    user: market_mizan

services:
  - type: web
    name: market-mizan-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: market-mizan-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://mmizan.com
      - key: PUBLIC_SITE_URL
        value: https://mmizan.com
      # Base for uploaded photo URLs (/api/media/<key>)
      - key: PUBLIC_API_URL
        value: https://market-mizan-api.onrender.com
      # Hostpoint SMTP — Passwort nur im Render-Dashboard setzen (Secret)
      # Team inbox for contact form, removal requests and admin alerts
      - key: MAIL_INBOX
        value: hello@mmizan.com
      # From/SMTP must match a real Hostpoint mailbox you control:
      - key: MAIL_FROM
        value: "Market Mizan <hello@mmizan.com>"
      - key: SMTP_HOST
        value: asmtp.mail.hostpoint.ch
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: hello@mmizan.com
      - key: SMTP_PASS
        sync: false
      # Read hello@mmizan.com. Defaults to the SMTP mailbox on Hostpoint if unset.
      - key: IMAP_HOST
        value: imap.mail.hostpoint.ch
      - key: IMAP_POLL
        value: "true"
      # WhatsApp Cloud API. Until these exist, the score is emailed to hello@mmizan.com instead.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ALERT_TO
        value: "251941881133"
      - key: INQUIRY_AUTO_REPLY
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: FX_ETB_USD
        value: "161"
      # Never run FX repair loops on boot — slows cold starts / investor demos.
      - key: JUSTPROPERTY_REPAIR_PRICES_ON_START
        value: "false"
      # Admin "Run scraper" must stay off on the API box.
      - key: SCRAPER_SOURCE
        value: off
    healthCheckPath: /health

  - type: web
    name: market-mizan-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        value: "+251941881133"
      - key: VITE_GA_MEASUREMENT_ID
        value: G-7NESMN9BJZ
      # Maps JavaScript + Embed API key. Restrict it to mmizan.com. Required before the map shows.
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false

  # Daily crawl. Default SCRAPER_SOURCE=soft (JP/Expat/Hoblen). Use hard|all for CF sites.
  - type: cron
    name: market-mizan-scraper
    runtime: python
    rootDir: scraper
    buildCommand: bash render-build.sh
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 bash render-start.sh
    schedule: "0 20 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-mizan-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      # auto = soft daily; on SCRAPER_HARD_DAY (UTC) → all (CF + soft). No manual switch.
      - key: SCRAPER_SOURCE
        value: auto
      # last = Monatsende UTC (besser für MoM-Statistik); oder 1 / 15 / 28
      - key: SCRAPER_HARD_DAY
        value: last
      - key: SCRAPER_SOFT_SOURCE
        value: soft
      - key: SCRAPER_HARD_SOURCE
        value: all
      - key: SCRAPER_SKIP_IF_SCRAPED_WITHIN_HOURS
        value: "336"
      # One-shot full refresh: set true, Trigger Run, then set false again.
      - key: SCRAPER_FORCE_RESCRAPE
        value: "false"
      # Decodo residential — split secrets preferred (sticky session appended in code).
      - key: SCRAPER_HTTP_PROXY_USER
        sync: false
      - key: SCRAPER_HTTP_PROXY_PASSWORD
        sync: false
      - key: SCRAPER_HTTP_PROXY_HOST
        value: gate.decodo.com
      - key: SCRAPER_HTTP_PROXY_PORT
        value: "10001"
      - key: SCRAPER_PROXY_STICKY
        value: "true"
      - key: SCRAPER_PROXY_SESSION_DURATION_MIN
        value: "90"
      - key: SCRAPER_CF_UNLOCK
        value: "true"
      - key: SCRAPER_CF_WAIT_MS
        value: "45000"
      - key: SCRAPER_CF_ABORT_AFTER
        value: "8"
      - key: SCRAPER_BROWSER_PROXY_SITES
        value: ethiopiarealty,addislist,realethio
      - key: SCRAPER_BROWSER_STEALTH
        value: "true"
      # text_mode disables JS — NEVER true for CF unlock sites
      - key: SCRAPER_BROWSER_TEXT_MODE
        value: "false"
      - key: SCRAPER_BROWSER_LIGHT_MODE
        value: "false"
      - key: SCRAPER_BROWSER_AVOID_ADS
        value: "false"
      - key: SCRAPER_BROWSER_AVOID_CSS
        value: "false"
      - key: FX_ETB_USD
        value: "161"
      - key: FX_ZAR_ETB
        value: "7.2"
      - key: SCRAPER_BATCH_SIZE
        value: "1"
      - key: SCRAPER_CONCURRENCY
        value: "1"
      - key: SCRAPER_BATCH_COOLDOWN_SEC
        value: "2"
      - key: JUSTPROPERTY_MAX_SEARCH_PAGES
        value: "10"
      - key: REALETHIO_PAGINATION_EXTRA_SLEEP_SEC
        value: "5"
      - key: CRAWL4AI_NO_CLOUD_NOTICE
        value: "1"
